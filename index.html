map.onpointerdown=e=>{if(e.target.tagName==='circle')return;drag=true;last=[e.clientX,e.clientY];map.classList.add('drag');map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];move(dx,dy)};map.onpointerup=()=>{drag=false;map.classList.remove('drag')};map.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1:-1)};document.getElementById('zin').onclick=()=>zoom(1);document.getElementById('zout').onclick=()=>zoom(-1);document.getElementById('home').onclick=()=>{z=6;cLat=46.65;cLon=2.35;render()};
const counts={h0:S.filter(s=>s.health===0).length,h1:S.filter(s=>s.health===1).length,h2:S.filter(s=>s.health===2).length,h3:S.filter(s=>s.health===3).length};
document.getElementById('n0').textContent='('+counts.h0+')';document.getElementById('n1').textContent='('+counts.h1+')';document.getElementById('n2').textContent='('+counts.h2+')';document.getElementById('n3').textContent='('+counts.h3+')';
const e0=document.getElementById('f0'),e1=document.getElementById('f1'),e2=document.getElementById('f2'),e3=document.getElementById('f3'),ec=document.getElementById('fc'),vc=document.getElementById('visibleCount');
function sync(){filters.h0=e0.checked;filters.h1=e1.checked;filters.h2=e2.checked;filters.h3=e3.checked;filters.circles=ec.checked;vc.textContent=S.filter(visible).length;render()}
[e0,e1,e2,e3,ec].forEach(x=>{x.onclick=e=>{e.stopPropagation()};x.onchange=sync});
const panel=document.getElementById('legendPanel');['pointerdown','mousedown','click','dblclick','wheel'].forEach(type=>panel.addEventListener(type,e=>e.stopPropagation()));
document.getElementById('allOn').onclick=e=>{e.stopPropagation();e0.checked=e1.checked=e2.checked=e3.checked=ec.checked=true;sync()};
document.getElementById('allOff').onclick=e=>{e.stopPropagation();e0.checked=e1.checked=e2.checked=e3.checked=ec.checked=false;sync()};
window.onresize=render;sync();
</script></body></html>
